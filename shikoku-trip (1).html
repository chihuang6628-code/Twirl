<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E86C8">
<title>四國自駕手帳｜2026.12.27–2027.01.02</title>
<style>
/* ---------- tokens ---------- */
:root{
  --sky:#2E86C8;        /* 主色：瀨戶內海的天藍 */
  --sky-deep:#1B5E8C;
  --sky-soft:#E3F1FB;
  --sky-line:#BDDCF1;
  --ink:#16323F;        /* 內文墨色 */
  --ink-2:#4C6575;      /* 次要文字（提高日光下對比）*/
  --paper:#F6FAFC;
  --card:#FFFFFF;
  --sun:#D98A2B;        /* 暖色點綴：只用於邊框與底色 */
  --sun-text:#97570D;   /* 暖色文字：符合 AA 的深橘 */
  --line:#E4EDF2;

  --serif:"Iowan Old Style",Palatino,"Hiragino Mincho ProN","Yu Mincho","Songti TC","Noto Serif TC","Source Han Serif TC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;

  --pad:18px;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--paper);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#6FB6E8; --sky-deep:#A9D6F4; --sky-soft:#17323F; --sky-line:#27475A;
    --ink:#E7F1F6; --ink-2:#A9BFCA; --paper:#0E1E26; --card:#152B35; --sun:#E7B168; --sun-text:#F0C078; --line:#24414F;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 108px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.72;
  letter-spacing:.01em;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:var(--sky-deep);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{
  padding:22px var(--pad) 16px;
  background:linear-gradient(180deg,var(--sky-soft),var(--paper));
  border-bottom:1px solid var(--line);
}
.top h1{
  font-family:var(--serif);font-weight:600;
  font-size:27px;line-height:1.35;margin:0 0 6px;letter-spacing:.03em;
}
.top .range{
  font-family:var(--serif);font-size:15px;color:var(--ink-2);
  letter-spacing:.06em;margin:0;
}
.countdown{
  margin-top:12px;display:inline-block;
  background:var(--card);border:1px solid var(--sky-line);
  color:var(--sky-deep);border-radius:999px;
  padding:6px 14px;font-size:14px;font-weight:600;
}

/* ---------- tabs ---------- */
.stickybar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--paper);
}
.tabs{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:var(--card);border-bottom:1px solid var(--line);
  padding:0 8px;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;appearance:none;background:none;border:0;
  font-family:var(--sans);font-size:15.5px;color:var(--ink-2);
  padding:14px 12px 11px;border-bottom:3px solid transparent;
  cursor:pointer;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--sky-deep);font-weight:700;border-bottom-color:var(--sky)}

/* ---------- day rail ---------- */
.dayrail{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px var(--pad);background:var(--paper);
  border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;
}
.dayrail::-webkit-scrollbar{display:none}
.daychip{
  flex:0 0 auto;appearance:none;cursor:pointer;
  background:var(--card);border:1px solid var(--sky-line);border-radius:12px;
  padding:7px 12px;min-width:62px;text-align:center;color:var(--ink-2);
  font-family:var(--sans);line-height:1.25;
}
.daychip b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);letter-spacing:.04em}
.daychip span{font-size:11.5px}
.daychip[aria-pressed="true"]{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;box-shadow:0 2px 8px rgba(27,94,140,.3)}
.daychip[aria-pressed="true"] b{color:#fff}

/* ---------- panels ---------- */
main{padding:0 var(--pad) 92px;max-width:640px;margin:0 auto}
.panel[hidden]{display:none}
.fade{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* ---------- day head ---------- */
.dayhead{padding:22px 0 6px}
.dayhead .date{
  font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--sky-deep);margin:0;
}
.dayhead h2{
  font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.45;
  margin:4px 0 10px;letter-spacing:.02em;
}
.dayhead.newyear .date{color:var(--sun-text)}
.staytag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sky-soft);color:var(--sky-deep);
  border-radius:10px;padding:7px 11px;font-size:13.5px;line-height:1.5;
}

/* ---------- timeline ---------- */
.timeline{list-style:none;margin:16px 0 0;padding:0;position:relative}
.timeline::before{
  content:"";position:absolute;left:13px;top:10px;bottom:24px;
  width:2px;background:linear-gradient(180deg,var(--sky-line),var(--line));
}
.stop{position:relative;padding:0 0 18px 42px}
.stop::before{
  content:attr(data-icon);position:absolute;left:0;top:2px;
  width:28px;height:28px;border-radius:50%;
  background:var(--card);border:2px solid var(--sky-line);
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.stop.key::before{border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
.stop .time{
  font-size:15px;font-weight:700;color:var(--sky-deep);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-top:5px;
}
.stop.key .card{border-color:var(--sky-line)}
.card h3{margin:0;font-size:18px;font-weight:700;line-height:1.48}
.card p{margin:5px 0 0;font-size:15.5px;color:var(--ink-2);line-height:1.68}
.maplink{
  display:inline-flex;align-items:center;gap:5px;margin-top:9px;
  font-size:13.5px;font-weight:600;color:var(--sky-deep);text-decoration:none;
  background:var(--sky-soft);border-radius:8px;padding:6px 11px;
}
.note{
  margin:6px 0 0;font-size:14.5px;color:var(--ink-2);
  border-left:3px solid var(--sky-line);padding-left:10px;
}

/* ---------- pager ---------- */
.pager{display:flex;gap:10px;margin-top:10px}
.pager button{
  flex:1;appearance:none;cursor:pointer;
  background:var(--card);border:1px solid var(--sky-line);border-radius:12px;
  color:var(--sky-deep);font-family:var(--sans);font-size:15px;font-weight:600;
  padding:13px 10px;
}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- placeholder ---------- */
/* ---------- 其他分頁 ---------- */
.sec{margin:26px 0 0}
.sec > h2{
  font-family:var(--serif);font-weight:600;font-size:20px;
  margin:0 0 4px;letter-spacing:.03em;
}
.sec > .lead{margin:0 0 12px;font-size:14.5px;color:var(--ink-2)}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin-bottom:10px;
}
.item h3{margin:0;font-size:17.5px;font-weight:700;line-height:1.48}
.item .meta{
  margin:5px 0 0;font-size:14.5px;line-height:1.62;color:var(--sky-deep);
  font-variant-numeric:tabular-nums;
}
.item p{margin:7px 0 0;font-size:15.5px;color:var(--ink-2);line-height:1.68}
.item .tip{
  margin:8px 0 0;font-size:14.5px;color:var(--ink-2);
  border-left:3px solid var(--sky-line);padding-left:10px;
}
.warn{
  margin:8px 0 0;font-size:14.5px;line-height:1.66;color:var(--ink);
  background:rgba(217,138,43,.10);border-left:3px solid var(--sun);
  padding:9px 11px;border-radius:0 8px 8px 0;
}
.warn::before{
  content:"注意";display:inline-block;margin-right:7px;
  font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--sun-text);vertical-align:1px;
}
.badge{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;
  font-size:11.5px;font-weight:700;vertical-align:2px;
  background:var(--sky-soft);color:var(--sky-deep);
}
.badge.est{background:rgba(217,138,43,.18);color:var(--sun-text)}
.legend{
  margin:14px 0 0;font-size:13px;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.money{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:12px;align-items:baseline}
.money:first-of-type{border-top:0}
.money .k{flex:1;font-size:15px}
.money .k small{display:block;font-size:13px;color:var(--ink-2)}
.money .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.total{
  margin-top:12px;background:var(--sky-soft);border-radius:12px;padding:13px 15px;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
}
.total b{font-family:var(--serif);font-size:19px;color:var(--sky-deep);font-variant-numeric:tabular-nums}
.phrase{display:flex;flex-wrap:wrap;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.phrase:first-child{border-top:0}
.phrase .jp{flex:1 1 60%;min-width:0;font-weight:600;word-break:break-word}
.phrase .zh{flex:1 1 auto;color:var(--ink-2);font-size:14px;text-align:right}

/* ---------- 匯率換算機 ---------- */
.fab{
  position:fixed;right:16px;z-index:40;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;
  background:var(--sky);color:#fff;font-size:24px;line-height:1;
  box-shadow:0 4px 16px rgba(22,50,63,.28);
}
.fab:active{transform:scale(.94)}
.sheet-bg{
  position:fixed;inset:0;z-index:50;background:rgba(10,25,33,.45);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-bg[hidden]{display:none}
.sheet{
  width:100%;max-width:560px;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:86vh;overflow-y:auto;
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;font-weight:600}
.sheet .hint{margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.cvt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cvt label{flex:0 0 52px;font-size:14px;font-weight:700;color:var(--sky-deep)}
.cvt input{
  flex:1;min-width:0;width:100%;font-family:var(--sans);font-size:19px;font-weight:600;
  color:var(--ink);background:var(--paper);border:1px solid var(--sky-line);
  border-radius:10px;padding:11px 12px;font-variant-numeric:tabular-nums;
}
.rate-row{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.rate-row input{
  width:92px;font-family:var(--sans);font-size:15px;font-weight:700;color:var(--ink);
  background:var(--paper);border:1px solid var(--sky-line);border-radius:8px;padding:7px 9px;
  font-variant-numeric:tabular-nums;
}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.quick button{
  appearance:none;cursor:pointer;background:var(--sky-soft);color:var(--sky-deep);
  border:0;border-radius:999px;padding:7px 13px;font-family:var(--sans);font-size:13.5px;font-weight:600;
}
.sheet-close{
  width:100%;margin-top:16px;appearance:none;cursor:pointer;
  background:var(--sky);color:#fff;border:0;border-radius:12px;
  font-family:var(--sans);font-size:15.5px;font-weight:600;padding:13px;
}
@media (max-width:360px){
  :root{--pad:14px}
  body{font-size:16px}
  .top h1{font-size:24px}
  .dayhead h2{font-size:21px}
  .tab{font-size:14.5px;padding:13px 9px 10px}
  .stop{padding-left:38px}
  .fab{width:50px;height:50px;font-size:21px}
}
@media print{
  :root{
    --paper:#fff;--card:#fff;--ink:#000;--ink-2:#333;
    --sky:#14486B;--sky-deep:#14486B;--sky-soft:#EEF5FA;--sky-line:#9BBBD2;
    --sun-text:#7A4708;--line:#CCC;
    padding:0;
  }
  body{background:#fff;font-size:11pt;line-height:1.55}
  .stickybar,.dayrail,.pager,.fab,.sheet-bg,.reset,.maplink{display:none !important}
  main{max-width:none;padding:0 8mm 8mm}
  .panel[hidden]{display:block !important}
  .top{background:none;border-bottom:2px solid #14486B;padding:0 8mm 6mm}
  .top h1{font-size:22pt}
  .countdown{display:none}
  .panel{break-before:page;page-break-before:always}
  #panel-plan{break-before:auto;page-break-before:auto}
  .dayhead{break-before:page;page-break-before:always;padding-top:0}
  #dayview .dayhead:first-of-type{break-before:auto;page-break-before:auto}
  .sec,.item,.stop,.card,.money,.chk,.phrase{break-inside:avoid;page-break-inside:avoid}
  .sec > h2,.dayhead h2{break-after:avoid;page-break-after:avoid}
  .item,.card{border:1px solid #CCC;box-shadow:none}
  .warn{background:#FBF3E8;border-left:3px solid #B4791F}
  .chk input{border:1.5px solid #666}
  footer{border-top:1px solid #CCC;margin-top:6mm}
}
  :root{--pad:14px}
  body{font-size:16px}
  .top h1{font-size:24px}
  .dayhead h2{font-size:21px}
  .tab{font-size:14.5px;padding:13px 9px 10px}
  .stop{padding-left:38px}
  .fab{width:50px;height:50px;font-size:21px}
}
.chk{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{
  appearance:none;width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;
  border:2px solid var(--sky-line);border-radius:6px;background:var(--card);
  cursor:pointer;position:relative;
}
.chk input:checked{background:var(--sky-deep);border-color:var(--sky-deep)}
.chk input:checked::after{
  content:"✓";position:absolute;inset:0;color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.chk span{font-size:15.5px;line-height:1.6;flex:1;min-width:0}
.chk input:checked + span{color:var(--ink-2);text-decoration:line-through}
.chk .when{
  display:inline-block;margin-right:7px;padding:1px 7px;border-radius:6px;
  font-size:11.5px;font-weight:700;background:var(--sky-soft);color:var(--sky-deep);
  vertical-align:1px;text-decoration:none;
}
.chk .when.now{background:rgba(217,138,43,.18);color:var(--sun-text)}
.reset{
  appearance:none;background:none;border:0;color:var(--ink-2);font-family:var(--sans);
  font-size:13.5px;padding:8px 0;cursor:pointer;text-decoration:underline;
}
footer{padding:26px var(--pad) 8px;text-align:center;color:var(--ink-2);font-size:13px}
</style>
</head>
<body>

<header class="top">
  <h1>四國自駕手帳</h1>
  <p class="range">2026.12.27 — 2027.01.02　七天六夜　三人同行</p>
  <div class="countdown" id="countdown">出發倒數</div>
</header>

<div class="stickybar">
<nav class="tabs" role="tablist" aria-label="主選單">
  <button class="tab" role="tab" id="tab-plan" aria-controls="panel-plan" aria-selected="true">行程</button>
  <button class="tab" role="tab" id="tab-spot" aria-controls="panel-spot" aria-selected="false">景點</button>
  <button class="tab" role="tab" id="tab-food" aria-controls="panel-food" aria-selected="false">美食</button>
  <button class="tab" role="tab" id="tab-move" aria-controls="panel-move" aria-selected="false">交通住宿</button>
  <button class="tab" role="tab" id="tab-cost" aria-controls="panel-cost" aria-selected="false">預算</button>
  <button class="tab" role="tab" id="tab-info" aria-controls="panel-info" aria-selected="false">實用資訊</button>
</nav>

<div class="dayrail" id="dayrail" aria-label="選擇日期"></div>
</div>

<main>
  <section class="panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan">
    <div id="dayview"></div>
    <div class="pager">
      <button id="prev" type="button">← 前一天</button>
      <button id="next" type="button">後一天 →</button>
    </div>
  </section>

  <section class="panel" id="panel-spot" role="tabpanel" aria-labelledby="tab-spot" hidden></section>
  <section class="panel" id="panel-food" role="tabpanel" aria-labelledby="tab-food" hidden></section>
  <section class="panel" id="panel-move" role="tabpanel" aria-labelledby="tab-move" hidden></section>
  <section class="panel" id="panel-cost" role="tabpanel" aria-labelledby="tab-cost" hidden></section>
  <section class="panel" id="panel-info" role="tabpanel" aria-labelledby="tab-info" hidden></section>

  <footer>訂位資料來自你的訂單　·　票價與營業時間查於 2026 年 9 月，出發前請再確認　·　地圖連結需連網</footer>
</main>

<button class="fab" id="fab" type="button" aria-label="打開匯率換算機">💱</button>

<div class="sheet-bg" id="cvtbg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cvttitle">
    <h2 id="cvttitle">匯率換算機</h2>
    <p class="hint">任一欄輸入就會即時換算。匯率可自己改，會記在這台裝置上。</p>

    <div class="cvt">
      <label for="jpy">日圓 ¥</label>
      <input id="jpy" type="number" inputmode="decimal" placeholder="0" autocomplete="off">
    </div>
    <div class="cvt">
      <label for="twd">台幣 NT$</label>
      <input id="twd" type="number" inputmode="decimal" placeholder="0" autocomplete="off">
    </div>

    <div class="rate-row">
      <span>¥100 =</span>
      <input id="rate" type="number" inputmode="decimal" step="0.1" value="21">
      <span>NT$（預設 21，出發前用當天匯率更新）</span>
    </div>

    <div class="quick">
      <button type="button" data-jpy="520">渡輪 ¥520</button>
      <button type="button" data-jpy="550">蔓橋 ¥550</button>
      <button type="button" data-jpy="1200">遊覽船 ¥1,200</button>
      <button type="button" data-jpy="1040">松山城 ¥1,040</button>
      <button type="button" data-jpy="34320">租車 ¥34,320</button>
    </div>

    <button class="sheet-close" id="cvtclose" type="button">關閉</button>
  </div>
</div>

<script>
/* ---------- 行程資料 ---------- */
const TRIP_START = new Date(2026,11,27);
const map = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

const DAYS = [
 {d:"12/27",w:"日",n:"D1",title:"抵達四國，夜宿琴平老街",
  stay:"すずめのお宿 すずめの間｜香川県仲多度郡琴平町1329", stayQ:"すずめのお宿 琴平",
  stops:[
   {t:"14:30–17:55",i:"✈",k:1,h:"華航 CI 178 桃園 → 高松",p:"桃園第二航廈（T2）報到，17:55 抵達高松機場。高松只有一棟航廈，到達、租車櫃台都在 1F。",q:"桃園國際機場第二航廈",
    note:"航廈以電子機票或華航 App 為準：桃園第三航廈北廊廳試營運中，華航部分班次會移過去。"},

/* ---------- 倒數 ---------- */
(function(){
  const el = document.getElementById("countdown");
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((TRIP_START - today) / 86400000);
  if (diff > 0) el.textContent = "出發倒數 " + diff + " 天";
  else if (diff >= -6) el.textContent = "旅程第 " + (1 - diff) + " 天";
  else el.textContent = "旅程已圓滿結束";
})();

/* ---------- 行程頁 ---------- */
const rail = document.getElementById("dayrail");
const view = document.getElementById("dayview");
let cur = 0;

DAYS.forEach((day,i)=>{
  const b = document.createElement("button");
  b.className = "daychip"; b.type = "button";
  b.setAttribute("aria-pressed", i===0 ? "true":"false");
  b.innerHTML = "<b>"+day.n+"</b><span>"+day.d+"（"+day.w+"）</span>";
  b.addEventListener("click", ()=>show(i));
  rail.appendChild(b);
});

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(day){
  let h = '<div class="dayhead'+(day.ny?" newyear":"")+'">'
        + '<p class="date">'+day.n+'　'+(day.d.charAt(0)==="1"?"2026/":"2027/")+day.d+'（'+day.w+'）</p>'
        + '<h2>'+esc(day.title)+'</h2>'
        + '<div class="staytag">🛏 '+esc(day.stay)+'</div></div><ol class="timeline">';
  day.stops.forEach(s=>{
    h += '<li class="stop'+(s.k?" key":"")+'" data-icon="'+s.i+'">'
       + '<div class="time">'+s.t+'</div><div class="card"><h3>'+esc(s.h)+'</h3>'
       + (s.p ? '<p>'+esc(s.p)+'</p>' : '')
       + (s.note ? '<p class="note">'+esc(s.note)+'</p>' : '')
       + (s.warn ? '<p class="warn">'+esc(s.warn)+'</p>' : '')
       + (s.q ? '<a class="maplink" href="'+map(s.q)+'" target="_blank" rel="noopener">📍 在地圖開啟</a>' : '')
       + '</div></li>';
  });
  return h + "</ol>";
}

function show(i){
  cur = i;
  const day = DAYS[i];
  view.innerHTML = render(day);
  view.classList.remove("fade"); void view.offsetWidth; view.classList.add("fade");
  [...rail.children].forEach((c,n)=>c.setAttribute("aria-pressed", n===i ? "true":"false"));
  rail.children[i].scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  document.getElementById("prev").disabled = i===0;
  document.getElementById("next").disabled = i===DAYS.length-1;
}
document.getElementById("prev").addEventListener("click",()=>{ if(cur>0){show(cur-1); window.scrollTo({top:0,behavior:"smooth"});}});
document.getElementById("next").addEventListener("click",()=>{ if(cur<DAYS.length-1){show(cur+1); window.scrollTo({top:0,behavior:"smooth"});}});

/* 旅程中自動跳到今天 */
(function(){
  const today = new Date(); today.setHours(0,0,0,0);
  const idx = Math.round((today - TRIP_START)/86400000);
  show(idx>=0 && idx<DAYS.length ? idx : 0);
})();

function items(list){

    + (x.p ? '<p>'+esc(x.p)+'</p>' : '')
    + (x.tip ? '<p class="tip">'+esc(x.tip)+'</p>' : '')
    + (x.warn ? '<p class="warn">'+esc(x.warn)+'</p>' : '')

    + '</div>').join("");

function sections(list){

    '<div class="sec"><h2>'+esc(s.title)+'</h2>'

}

function checklist(key, groups, withWhen){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch(e){ saved = {}; }
  let h = "";
  groups.forEach((g,gi)=>{
    h += '<div class="sec"><h2>'+esc(g.g)+'</h2><div class="item">';
    g.items.forEach((it,ii)=>{
      const id = key+"-"+gi+"-"+ii;
      const txt = withWhen ? it[1] : it;
      const when = withWhen ? it[0] : "";
      h += '<label class="chk" for="'+id+'"><input type="checkbox" id="'+id+'" data-k="'+id+'"'
         + (saved[id] ? " checked" : "") + '><span>'
         + (when ? '<span class="when'+(when==="現在"||when==="12/20"?" now":"")+'">'+esc(when)+'</span>' : '')
         + esc(txt) + '</span></label>';
    });
    h += '</div></div>';
  });
  return h;
}

function bindChecks(root, key){
  root.querySelectorAll('input[type="checkbox"][data-k^="'+key+'"]').forEach(cb=>{
    cb.addEventListener("change", ()=>{
      try{
        const s = JSON.parse(localStorage.getItem(key) || "{}");
        if (cb.checked) s[cb.dataset.k] = 1; else delete s[cb.dataset.k];
        localStorage.setItem(key, JSON.stringify(s));
      } catch(e){ /* 無法儲存時仍可勾選，只是重開會清空 */ }
    });
  });
}

/* ---------- 列印／存成 PDF：攤平成完整文件 ---------- */
(function(){
  let snapshot = null;
  function expand(){
    snapshot = { html: view.innerHTML, day: cur,
                 hidden: [...document.querySelectorAll(".panel")].map(p=>p.hidden) };
    view.innerHTML = DAYS.map(render).join("");
    document.querySelectorAll(".panel").forEach(p=>{ p.hidden = false; });
  }
  function restore(){
    if (!snapshot) return;
    view.innerHTML = snapshot.html;
    document.querySelectorAll(".panel").forEach((p,i)=>{ p.hidden = snapshot.hidden[i]; });
    cur = snapshot.day;
    snapshot = null;
  }
  window.addEventListener("beforeprint", expand);
  window.addEventListener("afterprint", restore);
  if (window.matchMedia){
    const mq = window.matchMedia("print");
    const onChange = e => e.matches ? expand() : restore();
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
})();

(function(){
  const bg = document.getElementById("cvtbg");
  const jpy = document.getElementById("jpy");
  const twd = document.getElementById("twd");
  const rate = document.getElementById("rate");

  try{
    const saved = localStorage.getItem("rate100");
    if (saved) rate.value = saved;
  } catch(e){}

  const r = () => {
    const v = parseFloat(rate.value);
    return (isFinite(v) && v > 0) ? v / 100 : 0.21;
  };
  const round = n => Math.round(n * 100) / 100;

  function fromJpy(){
    const v = parseFloat(jpy.value);
    twd.value = isFinite(v) ? round(v * r()) : "";
  }
  function fromTwd(){
    const v = parseFloat(twd.value);
    jpy.value = isFinite(v) ? Math.round(v / r()) : "";
  }

  jpy.addEventListener("input", fromJpy);
  twd.addEventListener("input", fromTwd);
  rate.addEventListener("input", ()=>{
    try{ localStorage.setItem("rate100", rate.value); } catch(e){}
    if (jpy.value !== "") fromJpy(); else if (twd.value !== "") fromTwd();
  });

  document.querySelectorAll(".quick button").forEach(b=>{
    b.addEventListener("click", ()=>{ jpy.value = b.dataset.jpy; fromJpy(); });
  });

  function open(){ bg.hidden = false; setTimeout(()=>jpy.focus(), 60); }
  function close(){ bg.hidden = true; }

  document.getElementById("fab").addEventListener("click", open);
  document.getElementById("cvtclose").addEventListener("click", close);
  bg.addEventListener("click", e=>{ if (e.target === bg) close(); });
  document.addEventListener("keydown", e=>{ if (e.key === "Escape" && !bg.hidden) close(); });
})();

const tabs = [...document.querySelectorAll(".tab")];
tabs.forEach(t=>{
  t.addEventListener("click",()=>{
    tabs.forEach(o=>{
      const on = o===t;
      o.setAttribute("aria-selected", on?"true":"false");
      const p = document.getElementById(o.getAttribute("aria-controls"));
      p.hidden = !on;
      if(on){ p.classList.remove("fade"); void p.offsetWidth; p.classList.add("fade"); }
    });
    rail.style.display = (t.id==="tab-plan") ? "flex" : "none";
    window.scrollTo({top:0,behavior:"smooth"});
  });
});
